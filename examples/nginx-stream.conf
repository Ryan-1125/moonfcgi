# From repository root: nginx -p <absolute-repository-path>/ -c examples/nginx-stream.conf
# Create logs/ and temp/ first. Start: moon run cmd/stream --target native
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 128; }
http {
    access_log logs/access.log;
    client_max_body_size 64m;
    client_body_temp_path temp;
    fastcgi_temp_path temp;
    upstream moonfcgi_stream {
        server 127.0.0.1:9000;
        # POSIX alternative (match socket owner/group permissions):
        # server unix:/run/moonfcgi/app.sock;
        keepalive 8;
    }
    server {
        listen 127.0.0.1:8080;
        location / {
            fastcgi_pass moonfcgi_stream;
            fastcgi_keep_conn on;
            fastcgi_request_buffering off;
            fastcgi_buffering off;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param DOCUMENT_URI $uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
        }
    }
}
