# Install as /etc/nginx/conf.d/moonfcgi.conf (inside the http context).
upstream moonfcgi_application {
    server unix:/run/moonfcgi/app.sock;
    keepalive 8;
}
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 8m;
    location / {
        fastcgi_pass moonfcgi_application;
        fastcgi_keep_conn on;
        fastcgi_request_buffering off;
        fastcgi_buffering off;
        fastcgi_read_timeout 35s;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param DOCUMENT_URI $uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }
}
